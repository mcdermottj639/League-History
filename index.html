<!DOCTYPE html>
<html lang="en" data-palette="champagne" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f1ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nectars Bolonga" />
  <title>Nectars Bolonga — League History</title>
  <meta name="description" content="Thirteen seasons of the Nectars Bolonga fantasy football league — champions, records, Cum Bowls, head-to-head, and the weekly power rankings." />
  <link rel="icon" type="image/png" href="favicon.png?v=3" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=58" />
  <!-- The rankings view reuses the Power Rankings Lab's own row styling, so
       what a member reads is pixel-identical to what the commissioner built.
       Loaded BEFORE league.css, which stays the last layer. -->
  <link rel="stylesheet" href="power.css?v=58" />
  <link rel="stylesheet" href="league.css?v=58" />
</head>
<body class="lg-body">
  <header class="lg-top">
    <div class="lg-brand">
      <span class="lg-shield">🏈</span>
      <h1>Nectars Bolonga<small>League history <span id="lg-ver"></span></small></h1>
    </div>
    <div class="lg-hd-r">
      <!-- What everything on the page means, from every page. The badge key
           used to be a card on Honors only, which put a badge on the Cum Bowl
           table four taps from its own explanation. -->
      <button type="button" id="lg-help" class="lg-help" aria-label="How this app works" title="How this app works">?</button>
      <!-- Who is reading. Always present, always tappable — a phone gets handed
           around and the first tap is often the wrong person. -->
      <button type="button" id="lg-me" class="lg-me"></button>
    </div>
  </header>

  <!-- The ? sheet. Empty until it is opened: it quotes counts out of the
       archive, and building it at load would freeze them (and the reader's
       name) before `setMe` has run. -->
  <div id="lg-sheet" class="lg-sheet" hidden></div>

  <!-- The name picker. It is the front door on a first visit and a header
       button forever after; it never gates content. -->
  <section id="lg-pick" class="lg-pick" hidden></section>

  <main id="lg-app" class="lg-main" hidden>
    <div id="lg-sub" class="ai-sub" role="tablist" aria-label="View"></div>
    <!-- Level 2 lives OUT here rather than inside the body, so the jump nav can
         sit under it: the sub-tabs choose the page, the jump nav moves within
         it, and a nav above the thing it navigates reads backwards. -->
    <div id="lg-sub2" class="ai-sub fh-sub2" role="tablist" aria-label="History view" hidden></div>
    <!-- Jump nav. Built from whatever the current view actually rendered, so
         it can never list a card that is not there or miss one that is. -->
    <nav id="lg-jump" class="lg-jump" aria-label="Jump to a section" hidden></nav>
    <div id="lg-body"></div>
    <footer class="lg-foot">
      <p>Thirteen seasons, 2013–2025 · every finish mapped to a person and cross-checked against ESPN's own owner column.</p>
    </footer>
  </main>

  <!-- The commissioner's gate. Loaded before league.js, which asks it
       whether to offer his name in the picker and link his Lab. -->
  <script src="owner.js?v=5" defer></script>
  <script src="espn.js?v=58" defer></script>
  <script src="history.js?v=58" defer></script>
  <script src="odds.js?v=58" defer></script>
  <script src="season.js?v=58" defer></script>
  <script src="league.js?v=58" defer></script>
</body>
</html>
