name: Apply personal storyline headings
on:
  push:
    branches: [codex/personal-story-headlines-v148]
    paths: [.github/workflows/apply-personal-headlines.yml]
permissions:
  contents: write
concurrency:
  group: personal-story-headlines-v148
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/personal-story-headlines-v148
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply presentation-only edits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '8ed400ba88d82d21c70fd36373942d1ef9ae8a20'
          cp history.js /tmp/headlines-original.js
          python3 - <<'PY'
          from pathlib import Path
          def edit(name, pairs):
              p=Path(name);text=p.read_text()
              for old,new in pairs:
                  count=text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{name}: expected one occurrence, got {count}: {old[:90]}')
                  text=text.replace(old,new,1)
              p.write_text(text)
          edit('history.js', [
              ('  function storyCardHTML(s) {', '''  /* v148: the personal page already identifies its manager. Only shorten
               that leading subject; keep opponents, evidence and league-overview voice. */
            function personalStoryHead(s) {
              const subject = nm(s.m);
              let head = s.head;
              if (head.startsWith(subject + ': ')) head = head.slice(subject.length + 2);
              else if (head.startsWith(subject + ' ')) {
                head = head.slice(subject.length + 1).replace(/^(?:have|has|went)\\s+/, '');
              }
              return cap(head);
            }

            function storyCardHTML(s, personal = false) {'''),
              ('<b class="fh-story-h">${esc(s.head)}${tag(s.src)}</b>', '<b class="fh-story-h">${esc(personal ? personalStoryHead(s) : s.head)}${tag(s.src)}</b>'),
              ('`<div class="fh-story fh-story-me">${inner}</div>`', '`<div class="fh-story fh-story-me" data-story-id="${esc(s.m + "/" + s.id)}">${inner}</div>`'),
              ('`<button type="button" class="fh-story fh-story-go" data-mgr="${esc(s.m)}">', '`<button type="button" class="fh-story fh-story-go" data-mgr="${esc(s.m)}" data-story-id="${esc(s.m + "/" + s.id)}">'),
              ("${pickStories().map(storyCardHTML).join('')}", "${pickStories().map((s) => storyCardHTML(s)).join('')}"),
              ("${mine.map(storyCardHTML).join('')}", "${mine.map((s) => storyCardHTML(s, true)).join('')}"),
              ("${storiesFor(m).map(storyCardHTML).join('')}", "${storiesFor(m).map((s) => storyCardHTML(s, true)).join('')}"),
          ])
          edit('checks.js', [
              ('window.LeagueHistory.profile(x.m).includes(x.head)', 'window.LeagueHistory.profile(x.m).includes(`data-story-id="${x.m}/${x.id}"`)'),
              ("window.LeagueHistory.view('you').includes(theirs)", "window.LeagueHistory.view('you').includes(`data-story-id=\"${x.m}/${x.id}\"`)"),
              ('prof.includes(x.head)', 'prof.includes(`data-story-id="${x.m}/${x.id}"`)'),
              ('you.includes(x.head)', 'you.includes(`data-story-id="${x.m}/${x.id}"`)'),
          ])
          edit('storylines.test.cjs', [("H.view('you').includes(s.head)", "H.view('you').includes(`data-story-id=\"${s.m}/${s.id}\"`)")])
          edit('storylines-balance.test.cjs', [('html.indexOf(esc(s.head))', 'html.indexOf(`data-story-id="${esc(s.m + "/" + s.id)}"`)')])
          edit('scripts/test-release.mjs', [("['storylines-balance.test.cjs'],", "['storylines-balance.test.cjs'],['storylines-headlines.test.cjs'],")])
          for name in ['index.html','power.html','sw.js','league.js']:
              p=Path(name);text=p.read_text()
              revised=text.replace('v=147','v=148').replace("'v147'","'v148'").replace("'leaguehistory-v147'","'leaguehistory-v148'")
              if text == revised: raise RuntimeError(f'No version updated: {name}')
              p.write_text(revised)
          entry='''## v148 — Personal storyline headlines start with the story

          Personal storyline headings on the You page and manager profiles omit the
          redundant leading subject: "The six-seed heist." rather than "You: the six-seed
          heist." The league-wide overview keeps its named/reader-aware headings so each
          card is still identifiable. Body copy and opponent references keep their voice.

          `personalStoryHead` is presentation-only: it removes the exact leading subject
          and optional auxiliary wording, never names elsewhere in a sentence. The
          story engine, selection, ordering, evidence, archive and all four notable roasts
          are unchanged. Cards carry stable `data-story-id` attributes so coverage tests
          verify their presence independently of the display heading. Tests cover all
          12 manager profiles in 13 reader states, own pages, overview attribution and
          opponent references. `storylines-headlines.test.cjs` runs in `npm test`.

          '''
          edit('CLAUDE.md', [('## v147 — Stories worth retelling',entry+'## v147 — Stories worth retelling')])
          Path('.github/workflows/apply-personal-headlines.yml').unlink()
          PY
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          function load(path){const c={window:{}};vm.runInNewContext(fs.readFileSync(path,'utf8'),c);return c.window.LeagueHistory;}
          const before=load('/tmp/headlines-original.js'),after=load('history.js');
          const attr=s=>s.replace(/ data-story-id="[^"]*"/g,'');
          const body=s=>attr(s).replace(/<b class="fh-story-h">[\s\S]*?<\/b>/g,'<b class="fh-story-h">HEADLINE</b>');
          assert.equal(JSON.stringify(before._stats),JSON.stringify(after._stats));
          for(const reader of [null,...before.roster().map(a=>a.m)]){
            before.setMe(reader);after.setMe(reader);
            assert.equal(JSON.stringify(before._stories()),JSON.stringify(after._stories()));
            assert.equal(JSON.stringify(before._cardStories()),JSON.stringify(after._cardStories()));
            for(const view of ['hon','rec','cb','lore'])assert.equal(before.view(view),attr(after.view(view)),view);
            assert.equal(body(before.view('you')),body(after.view('you')));
            for(const a of before.roster())assert.equal(body(before.profile(a.m)),body(after.profile(a.m)));
          }
          console.log('Only personal headline presentation changed; all stories, evidence, order, roasts, archive and other views preserved.');
          JS
          git diff --check
      - run: npm ci
      - run: npm test
      - name: Commit tested release only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'v148: start personal storyline headings with the story'
          git push origin HEAD:refs/heads/codex/personal-story-headlines-v148
