name: Reconcile reviewed storylines
on:
  push:
    branches: [codex/league-stories-v145]
    paths: [scripts/reconcile-stories.py]
permissions:
  contents: write
concurrency:
  group: league-storylines-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/league-stories-v145
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Integrate without overwriting newer league rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '12f07d01357ac21a3cce385e23121ecd063a3ee1'
          mkdir -p /tmp/reviewed-stories
          cp history.js CLAUDE.md storylines-balance.test.cjs /tmp/reviewed-stories/
          cp scripts/reconcile-stories.py /tmp/reconcile-stories.py
          git show origin/main:history.js > /tmp/current-history.js
          git merge --no-commit --no-ff origin/main || test -f .git/MERGE_HEAD
          git checkout origin/main -- history.js checks.js storylines.test.cjs CLAUDE.md index.html power.html sw.js league.js scripts/test-release.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 /tmp/reconcile-stories.py . /tmp/reviewed-stories
          rm .github/workflows/reconcile-storylines.yml scripts/reconcile-stories.py
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          function load(p){const c={window:{}};vm.runInNewContext(fs.readFileSync(p,'utf8'),c);return c.window.LeagueHistory;}
          const before=load('/tmp/current-history.js'),after=load('history.js');
          assert.equal(JSON.stringify(before._stats),JSON.stringify(after._stats));
          for(const view of ['hon','rec','cb']) assert.equal(before.view(view),after.view(view),view);
          console.log('Archive, career records, playoff counts, Trophy Case, Record Book and Cum Bowl preserved.');
          JS
          git diff --check
      - run: npm ci
      - run: npm test
      - name: Publish only the tested integration
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'v146: integrate balanced storylines with money-playoff rules'
          git push origin HEAD:refs/heads/codex/league-stories-v145
      - name: Tested source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-source
          retention-days: 3
          path: |
            *.js
            *.cjs
            *.html
            *.css
            *.json
            *.md
            *.png
            *.webmanifest
            season/
            parlay/
            logos/
            fixtures/
            scripts/
            server/
            supabase/
