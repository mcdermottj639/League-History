name: Apply reviewed storyline change
on:
  push:
    branches: [codex/league-stories-v145]
    paths: [scripts/story-curation.fragment.js]
permissions:
  contents: write
concurrency:
  group: league-stories-v145-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/league-stories-v145'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/league-stories-v145
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed edits against the verified base
        shell: bash
        run: |
          test "$(git hash-object history.js)" = '0273857f7602dc6487dee8f1b9a55a2a80a8aa18'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('history.js');s=p.read_text()
          a=s.index('  /* ── nobody gets an empty page')
          b=s.index('  /* 🚨 Built PER READER',a)
          s=s[:a]+Path('scripts/story-curation.fragment.js').read_text()+'\n'+s[b:]
          a=s.index('    /* 🚨 TWO PHASES, AND THE ORDER')
          b=s.index('    return _stCache;',a)
          s=s[:a]+'''    // Curate after detection, with facts and event identities still attached.
              // No worst-stat fallback: a roast never satisfies achievement coverage.
              _stCache = curateStories(keep(emit(DETECT)));
              _stFor = ME;
          '''+s[b:]
          s=s.replace('  const storiesFor = (m) => stories().filter((x) => x.m === m);', '''  const storiesFor = (m) => {
              const all = stories().filter((x) => x.m === m);
              const lead = all.filter((x) => x.tone === 'positive').slice(0, WANT);
              return lead.concat(all.filter((x) => !lead.includes(x)));
            };''')
          s=s.replace('  /* The floor `signature` tops every manager up to (v22). One card stops a\n     page being blank; two is what makes it worth opening. */', '  /* Two distinct positive stories lead each established career (v145).\n     Droughts and roasts remain additional stories, never coverage fillers. */')
          s=s.replace('Cheap: eighteen strings.', 'The curated stories keep their evidence in every voice.')
          s=s.replace('    // bigScores explicitly omits records already carried by noPodium.', '    // The curator separates achievements from droughts and joins their evidence.')
          p.write_text(s)
          p=Path('storylines.test.cjs');s=p.read_text()
          s=s.replace("assert.match(story('Hurd', 'scorer').body, /2 finals, 5 final fours/);", "assert.match(story('Hurd', 'scorer').body, /2013, 2016 and 2018/);\nassert.equal(ALL.find(a => a.m === 'Hurd').fin, 2);\nassert.equal(ALL.find(a => a.m === 'Hurd').f4, 5);")
          s=s.replace("assert.match(story('Christel', 'nopod').body, /2nd-highest championship-bracket score \\(183.3\\)/);", "assert.match(story('Christel', 'playoff-explosion').head, /183.3/);\nassert.match(story('Christel', 'playoff-explosion').body, /2nd-highest score in championship-bracket history/);\nassert.ok(!/183.3/.test(story('Christel', 'nopod').body), 'the highlight is no longer buried in the drought');")
          p.write_text(s)
          p=Path('scripts/test-release.mjs');s=p.read_text().replace("['storylines.test.cjs'],", "['storylines.test.cjs'],['storylines-balance.test.cjs'],");p.write_text(s)
          for name in ['index.html','power.html','sw.js','league.js']:
              p=Path(name);s=p.read_text().replace('v=144','v=145').replace("'v144'", "'v145'").replace("'leaguehistory-v144'", "'leaguehistory-v145'");p.write_text(s)
          p=Path('CLAUDE.md');s=p.read_text()
          entry='''## v145 — Stories worth retelling

          The archive now curates **distinct achievements and notable league lore**, rather
          than filling short profiles with whichever career ranking is furthest from the
          middle. Every currently tracked manager has at least two fact-backed positive
          stories. Profiles and the You page lead with those two; memorable droughts and
          roasts remain visible immediately afterward. Tone labels are internal metadata,
          not badges or explanations in the members' app.

          `curateStories` in `history.js` consumes the existing detectors and the same
          season/game archive. New shapes include six-seed title/final runs, narrow escapes
          on the way to a title, decisive finals, historic playoff scores, Cum-Bowl-to-final
          turnarounds, strong regular seasons and consecutive playoff qualifications.
          It contains no manager-specific exceptions. Counts, opponents, years, scores,
          seeds, ties and sample scopes are derived, never hand-maintained copy.

          Event claim keys stop one postseason being counted as two achievements. One
          signature playoff moment per manager is a topic rule, not a total card cap;
          other distinct accomplishments remain. Duplicate drought/last-place cards are
          combined, while four notable roast cards currently survive. The Luck Index and
          all record-book data remain intact. The league overview still gives every manager
          one distinct headline, independent of the reader's identity. Second-person voice,
          public access, private links, rankings, parlay logic and v144's COUNTED pool are
          unchanged. No archive facts were edited.

          The v22 worst-stat `signature` fallback is retired. `storiesFor` orders the first
          two positive cards without removing the remaining stories. `evidence`, `claims`
          and `tone` make the selection testable. Do not satisfy coverage with fake praise,
          a consolation record, a relabeled loss, or two versions of the same season.

          Verification: `node checks.js`, `node storylines.test.cjs` and
          `node storylines-balance.test.cjs`; the latter covers all twelve managers and a
          stranger, 168 profile/You renders, independent game evidence, retained roasts,
          event deduplication, ties and changed-fact scenarios. It runs in `npm test`.

          '''
          s=s.replace('## v144 — Consolation-bracket games are not counted',entry+'## v144 — Consolation-bracket games are not counted',1)
          s=s.replace('## v90 — Accurate season narratives and member storylines (current state)', '## v90 — Accurate season narratives and member storylines\n\n⚠️ Member-story selection and prose are superseded by v145; the season-data and scoring-scope accuracy rules still apply.')
          s=s.replace('    `signature` closes that, and `checks.js` now fails if it ever reopens.', '    ⚠️ SUPERSEDED in v145: `curateStories` replaces `signature` with earned positive coverage; checks still guard against missing managers.')
          p.write_text(s)
          Path('scripts/story-curation.fragment.js').unlink()
          PY
          git diff --check
      - run: npm ci
      - run: npm test
      - name: Commit only the tested release files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- history.js CLAUDE.md index.html power.html league.js sw.js scripts/test-release.mjs storylines.test.cjs scripts/story-curation.fragment.js
          git diff --cached --check
          git commit -m 'v145: memorable achievements with balanced league lore'
          git push origin HEAD:refs/heads/codex/league-stories-v145
