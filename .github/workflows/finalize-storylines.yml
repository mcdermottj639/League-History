name: Finalize reviewed storyline release
on:
  push:
    branches: [codex/league-stories-v145]
    paths: [.github/workflows/finalize-storylines.yml]
permissions:
  contents: write
concurrency:
  group: league-storylines-finalize
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/league-stories-v145
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Preserve the current career-card release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '55ac478ace254329a87aa6ce692537802eacc53a'
          cp CLAUDE.md /tmp/storyline-doc.md
          git show origin/main:history.js > /tmp/current-history.js
          git merge --no-commit --no-ff origin/main || test -f .git/MERGE_HEAD
          git checkout origin/main -- CLAUDE.md
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 - <<'PY'
          from pathlib import Path
          old=Path('/tmp/storyline-doc.md').read_text()
          a=old.index('## v146 — Stories worth retelling');b=old.index('## v145 —',a)
          entry=old[a:b].replace('v146','v147')
          entry=entry.replace('No archive facts were edited.', 'No archive facts were edited. The v146 playoff standings and career-card\nplayoff-record tile are also preserved.')
          p=Path('CLAUDE.md');s=p.read_text();a=s.index('## v146 —');s=s[:a]+entry+s[a:]
          s=s.replace('## v90 — Accurate season narratives and member storylines (current state)', '## v90 — Accurate season narratives and member storylines\n\n⚠️ Member-story selection and prose are superseded by v147; season-data and scoring-scope accuracy rules still apply.')
          s=s.replace('    `signature` closes that, and `checks.js` now fails if it ever reopens.', '    ⚠️ SUPERSEDED in v147: `curateStories` replaces `signature` with earned positive coverage; checks still guard against missing managers.')
          p.write_text(s)
          p=Path('history.js');s=p.read_text().replace('/* v146: choose stories','/* v147: choose stories').replace('Two distinct positive stories lead each established career (v146).','Two distinct positive stories lead each established career (v147).');p.write_text(s)
          for name in ['index.html','power.html','sw.js','league.js']:
              p=Path(name);s=p.read_text().replace('v=146','v=147').replace("'v146'", "'v147'").replace("'leaguehistory-v146'", "'leaguehistory-v147'");p.write_text(s)
          Path('.github/workflows/finalize-storylines.yml').unlink()
          PY
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          function load(p){const c={window:{}};vm.runInNewContext(fs.readFileSync(p,'utf8'),c);return c.window.LeagueHistory;}
          const before=load('/tmp/current-history.js'),after=load('history.js');
          assert.equal(JSON.stringify(before._stats),JSON.stringify(after._stats));
          for(const view of ['hon','rec','cb'])assert.equal(before.view(view),after.view(view),view);
          for(const a of after._stats.ALL)assert.ok(after.profile(a.m).includes('Playoff record'));
          const stories=after._stories();assert.equal(stories.length,31);assert.equal(stories.filter(s=>s.tone==='roast').length,4);
          console.log('Current archive, playoff standings, career-card playoff records and four roasts preserved.');
          JS
          git diff --check
      - run: npm ci
      - run: npm test
      - name: Commit tested final integration
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'v147: balanced league stories preserving the current career cards'
          git push origin HEAD:refs/heads/codex/league-stories-v145
      - name: Source verification snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-source
          retention-days: 3
          path: |
            *.js
            *.cjs
            *.html
            *.css
            *.json
            *.md
            *.png
            *.webmanifest
            season/
            parlay/
            logos/
            fixtures/
            scripts/
            server/
            supabase/
