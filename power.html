<!DOCTYPE html>
<html lang="en" data-palette="champagne" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f1ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Power Rankings" />
  <title>Power Rankings Lab — Nectars Bolonga</title>
  <meta name="description" content="Weekly fantasy-football power rankings — pre-built from real league data, reordered and annotated by hand, then shared with the league." />
  <link rel="icon" type="image/png" href="favicon.png?v=3" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- ⚠️ SHARED FILES, ONE ?v= EACH — the same rule `owner.js` follows, and
       for the same reason. `styles.css` and `power.css` are BOTH loaded by
       `index.html` too, so a second counter here is a second source of truth
       for the freshness of one file: bump one and the other page goes on
       serving the copy it cached. (`styles.css` sat at ?v=1 from the move
       until v28 while index.html walked it to 28, so a device that had opened
       the Lab was pinned to the pre-v20 stylesheet on this page indefinitely.)
       These two ride index.html's numbers; `power.js` below is Lab-only and
       keeps its own. -->
  <link rel="stylesheet" href="styles.css?v=35" />
  <link rel="stylesheet" href="power.css?v=35" />
</head>
<body class="pr-page">
  <header class="pr-top">
    <div class="pr-brand">
      <span class="pr-shield">🏆</span>
      <h1>Power Rankings<small>Nectars Bolonga</small></h1>
    </div>
    <a class="pr-back" href="index.html">← League app</a>
  </header>

  <main class="pr-main">
    <section id="pr-load" hidden></section>
    <section id="pr-rank" hidden></section>
    <section id="pr-shared" hidden></section>
  </main>

  <!-- Shared with the league app, so its ?v= is its own: bump it in BOTH
       pages together or one of them serves a stale gate. -->
  <script src="owner.js?v=3" defer></script>
  <script src="power.js?v=8" defer></script>
</body>
</html>
